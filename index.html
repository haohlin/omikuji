<!DOCTYPE html>
<html lang="zh" data-lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>御神籤 · Omikuji</title>
<meta name="description" content="日式寺庙御神籤 Omikuji — 观音百签 · 元三大师 · 中日英三语">
<meta property="og:title" content="御神籤 · Omikuji">
<meta property="og:description" content="振一振签筒，抽一支心签。观音百签 · 中日英三语。">
<meta property="og:type" content="website">
<link rel="stylesheet" href="style.css?v=20260429-reference-toggle-fix-share">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700;900&family=Noto+Serif+JP:wght@400;500;700;900&family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛩️</text></svg>">
</head>
<body>
<div id="paper-bg"></div>
<canvas id="sakura"></canvas>

<div class="lang-switch">
  <button data-lang="zh" class="active">中</button>
  <button data-lang="ja">日</button>
  <button data-lang="en">EN</button>
</div>

<!-- STAGE 1: Torii + intro -->
<main id="stage-intro" class="stage active">
  <div class="torii">
    <div class="torii-top"></div>
    <div class="torii-beam"></div>
    <div class="torii-pillar left"></div>
    <div class="torii-pillar right"></div>
  </div>
  <h1 class="shrine-title" data-i18n="title">御神籤</h1>
  <p class="shrine-sub" data-i18n="sub">観音百籤 · 元三大師</p>
  <p class="shrine-inst" data-i18n="inst">心を静め、願いを念じて筒を振る</p>
  <button id="go-shake" class="go-btn" data-i18n="start">参拝へ</button>
  <p class="credit">made with 🐻 · <a href="https://github.com/" target="_blank" id="gh-link">GitHub</a></p>
</main>

<!-- STAGE 2: Shake -->
<section id="stage-shake" class="stage">
  <p class="shake-prompt" data-i18n="shakePrompt">筒を振るか、画面を連打する</p>
  <div id="box-wrap">
    <div id="box">
      <div id="box-body"></div>
      <div id="box-lid"><div id="box-hole"></div></div>
      <div id="stick-peek"></div>
    </div>
  </div>
  <p class="shake-count"><span id="shake-count">0</span><span data-i18n="shakeUnit"> 回</span></p>
  <button id="go-draw" class="go-btn hidden" data-i18n="draw">籤を引く</button>
  <button id="go-back1" class="mini-btn ghost" data-i18n="back">戻る</button>
</section>

<!-- STAGE 3: Stick reveal -->
<section id="stage-stick" class="stage">
  <div class="stick-floating" id="stick-floating"></div>
  <p class="stick-number" id="stick-number">第 一 番</p>
  <button id="go-paper" class="go-btn" data-i18n="openPaper">お籤を開く</button>
</section>

<!-- STAGE 4: Paper -->
<section id="stage-paper" class="stage">
  <div id="paper" data-layout="reference">
    <div class="paper-inner">
      <div class="paper-layout-switch" role="group" aria-label="Paper layout">
        <button id="layout-reference" class="layout-btn active" data-layout="reference" data-i18n="layoutReference">稲荷纸签</button>
        <button id="layout-card" class="layout-btn" data-layout="card" data-i18n="layoutCard">卡片版</button>
      </div>
      <div class="omikuji-frame">
        <div class="paper-crest" aria-hidden="true"><span>稲</span></div>
        <div class="omikuji-header">
          <div class="header-cell number-cell">
            <span class="paper-num" id="p-num">第一番</span>
            <small id="p-num-en">No. 1</small>
          </div>
          <div class="header-cell shrine-cell">
            <span class="paper-shrine" id="p-shrine-title">総本宮 御神籤</span>
            <small id="p-shrine-sub">Kannon Hundred Lots</small>
          </div>
          <div class="header-cell fortune-cell">
            <span class="paper-fortune" id="p-fortune">大吉</span>
            <small id="p-fortune-en">Great Blessing</small>
          </div>
        </div>
        <div class="omikuji-body">
          <div class="vertical-main">
            <div class="paper-title-vertical">御神籤</div>
            <div class="poem-zh" id="p-poem-zh"></div>
          </div>
          <div class="poem-alt-wrap">
            <div class="poem-alt-label" data-i18n="altLabel">和歌</div>
            <div class="poem-alt-text" id="p-poem-alt"></div>
          </div>
          <div class="summary-wrap">
            <div class="summary-label" data-i18n="summaryTitle">解签</div>
            <div class="summary" id="p-summary"></div>
          </div>
          <div class="aspects" id="p-aspects"></div>
        </div>
        <div class="omikuji-footer-mark">
          <span>元三大師</span>
          <span>観音百籤</span>
        </div>
      </div>
      <div class="paper-footer">
        <button id="btn-share" class="mini-btn" data-i18n="share">分享</button>
        <button id="btn-again"  class="mini-btn" data-i18n="again">再び引く</button>
      </div>
    </div>
  </div>
</section>

<script src="data/omikuji.js"></script>
<script src="app.js?v=20260429-reference-toggle-fix-share"></script>
</body>
</html>
